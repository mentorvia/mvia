# This file tells Render how to build and run mVia.
# It also creates a free PostgreSQL database and wires it in automatically.
services:
  - type: web
    name: mvia
    runtime: python
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: mvia-db
          property: connectionString

databases:
  - name: mvia-db
    plan: free
